<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ломбард Народный{% endblock %}</title>
    {% load static %}
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== ШАПКА ===== */
        .header {
            background-color: #ffffff;
            border-bottom: 1px solid #dee2e6;
            padding: 0;
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            height: 80px;
            gap: 15px;
        }

        .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            flex-shrink: 0;
        }

        .logo {
            height: 45px;
            display: block;
        }

        /* Кнопки меню */
        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-grow: 1;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
            height: 96px;             /* чуть крупнее */
            min-width: 90px;         /* чуть крупнее */
            background: transparent;
            color: #000000;
            border: none;             /* 👈 убрали рамки */
            border-radius: 6px;
            font-size: 1em;
            font-weight: 700;         /* 👈 жирный шрифт */
            text-decoration: none;
            cursor: pointer;
            transition: none;          /* 👈 убираем любые переходы */
            white-space: nowrap;
            letter-spacing: 0.3px;
        }

        .nav-btn:hover {
            background: transparent;   /* 👈 никакого фона при наведении */
            color: #000000;
        }

        /* Кнопка "Личный кабинет" прижимается к правому краю */
        .nav-btn-account {
            margin-left: auto;
        }

        .main-content {
            flex: 1;
            padding: 2rem 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ===== ФУТЕР ===== */
        .footer {
            background-color: #343a40;
            color: white;
            padding: 2rem 0;
            margin-top: auto;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: white;
            text-decoration: none;
            margin-left: 2rem;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        /* ===== АДАПТИВНОСТЬ ===== */
        @media (max-width: 900px) {
            .header-inner {
                height: auto;
                flex-wrap: wrap;
                padding: 10px 15px;
                gap: 10px;
            }

            .nav-buttons {
                flex-wrap: wrap;
                width: 100%;
            }

            .nav-btn {
                flex: 1;
                min-width: 90px;
                padding: 0 12px;
                font-size: 0.9em;
                height: 44px;
            }

            .nav-btn-account {
                margin-left: 0;
            }
        }

        @media (max-width: 500px) {
            .logo {
                height: 35px;
            }

            .nav-btn {
                min-width: 70px;
                height: 40px;
                font-size: 0.8em;
                padding: 0 8px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <!-- Логотип -->
            <a href="{% url 'index' %}" class="logo-link">
                <img src="{% static 'logo.jpg' %}" alt="Ломбард Народный" class="logo">
            </a>

            <!-- Кнопки навигации -->
            <nav class="nav-buttons">
                <button class="nav-btn" type="button">Меню</button>
                <button class="nav-btn" type="button">Город</button>
                <a href="{% url 'branches' %}" class="nav-btn">Филиалы</a>
                <button class="nav-btn nav-btn-account" type="button">Личный кабинет</button>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-info">
                    <p>&copy; 2024 Ломбард Народный. Все права защищены.</p>
                </div>
                <div class="footer-links">
                    <a href="{% url 'contacts' %}">О нас</a>
                    <a href="{% url 'contacts' %}">Контакты</a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
