{% extends 'base/base.html' %}
{% load static %}

{% block title %}Главная - Ломбард Народный{% endblock %}

{% block content %}

<style>
    /* ==========================================================================
       СЕКЦИЯ ФИЛИАЛОВ (карта + список)
       ========================================================================== */

    .branches-section {
        width: 100%;
        padding: 0;
        margin: 0 auto 40px;
    }

    .branches-layout {
        display: grid;
        grid-template-columns: 1fr 420px;
        gap: 20px;
        height: 520px;             /* компактная высота */
        align-items: stretch;
    }

    /* ===== Карта ===== */
    .branches-map {
        width: 100%;
        height: 100%;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #e5e5e5;
        background: #f7f7f7;
    }

    /* ===== Боковая панель ===== */
    .branches-sidebar {
        height: 100%;
        background: #ffffff;
        border: 1px solid #e5e5e5;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* Общие стили для вьюх внутри панели */
    .sidebar-view {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;             /* чтобы работал внутренний скролл */
    }

    .sidebar-view[hidden] {
        display: none;
    }

    /* ===== Заголовок списка ===== */
    .sidebar-header {
        padding: 20px 24px 12px;
        border-bottom: 1px solid #f0f0f0;
        flex-shrink: 0;
    }

    .sidebar-title {
        font-size: 1.3em;
        font-weight: 700;
        color: #000000;
        margin: 0;
    }

    .sidebar-subtitle {
        font-size: 0.9em;
        color: #666666;
        margin-top: 4px;
    }

    /* ===== Список филиалов (со скроллом) ===== */
    .branches-list {
        list-style: none;
        padding: 0;
        margin: 0;
        overflow-y: auto;          /* ← скроллбар */
        flex: 1;
        min-height: 0;
    }

    /* Стили скроллбара (для WebKit) */
    .branches-list::-webkit-scrollbar {
        width: 6px;
    }

    .branches-list::-webkit-scrollbar-track {
        background: transparent;
    }

    .branches-list::-webkit-scrollbar-thumb {
        background: #d0d0d0;
        border-radius: 3px;
    }

    .branches-list::-webkit-scrollbar-thumb:hover {
        background: #b0b0b0;
    }

    /* ===== Элемент списка ===== */
    .branch-item {
        display: block;
        padding: 16px 24px;
        border-bottom: 1px solid #f5f5f5;
        cursor: pointer;
        transition: background 0.15s ease;
    }

    .branch-item:hover {
        background: #fafafa;
    }

    .branch-item.is-active {
        background: #f0f0f0;
    }

    .branch-item__row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
    }

    .branch-item__info {
        flex: 1;
        min-width: 0;
    }

    .branch-item__address {
        font-size: 1em;
        font-weight: 600;
        color: #000000;
        margin-bottom: 4px;
        word-wrap: break-word;
    }

    .branch-item__schedule {
        font-size: 0.9em;
        color: #666666;
    }

    .branch-item__arrow {
        font-size: 1.2em;
        color: #999999;
        flex-shrink: 0;
        margin-top: 2px;
    }

    /* ===== Детальная панель ===== */
    .sidebar-detail-header {
        padding: 12px 20px;
        border-bottom: 1px solid #f0f0f0;
        flex-shrink: 0;
    }

    .sidebar-back {
        background: transparent;
        border: none;
        color: #000000;
        font-size: 1.1em;
        cursor: pointer;
        padding: 6px 4px;
        font-family: inherit;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }

    .sidebar-back:hover {
        color: #666666;
    }

    .sidebar-detail-body {
        padding: 20px 24px 24px;
        overflow-y: auto;
        flex: 1;
        min-height: 0;
    }

    .sidebar-detail-body::-webkit-scrollbar {
        width: 6px;
    }

    .sidebar-detail-body::-webkit-scrollbar-thumb {
        background: #d0d0d0;
        border-radius: 3px;
    }

    .detail-title {
        font-size: 1.3em;
        font-weight: 700;
        color: #000000;
        margin: 0 0 6px;
        line-height: 1.3;
    }

    .detail-city {
        font-size: 0.95em;
        color: #666666;
        margin-bottom: 16px;
    }

    .detail-schedule {
        font-size: 0.95em;
        color: #333333;
        margin-bottom: 14px;
    }

    .detail-phone {
        font-size: 1em;
        color: #000000;
        margin-bottom: 18px;
    }

    .detail-phone a {
        color: #000000;
        text-decoration: none;
        font-weight: 600;
    }

    .detail-phone a:hover {
        text-decoration: underline;
    }

    .detail-status {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.85em;
        font-weight: 600;
        margin-bottom: 18px;
    }

    .detail-status--open {
        background: #eaf7ea;
        color: #2a7a2a;
    }

    .detail-status--closed {
        background: #f7eaea;
        color: #a02a2a;
    }

    .detail-route-btn {
        display: block;
        width: 100%;
        padding: 12px 16px;
        background: #000000;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-family: inherit;
        font-size: 1em;
        font-weight: 600;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
        transition: background 0.15s ease;
    }

    .detail-route-btn:hover {
        background: #222222;
    }

    /* ===== Адаптивность ===== */
    @media (max-width: 900px) {
        .branches-layout {
            grid-template-columns: 1fr;
            grid-template-rows: 300px 1fr;
            height: auto;
        }

        .branches-map {
            height: 300px;
        }

        .branches-sidebar {
            height: 400px;
        }
    }

    @media (max-width: 500px) {
        .branches-layout {
            grid-template-rows: 250px 1fr;
        }

        .branches-map {
            height: 250px;
        }

        .branches-sidebar {
            height: 360px;
        }

        .branch-item {
            padding: 14px 18px;
        }

        .sidebar-header,
        .sidebar-detail-body {
            padding-left: 18px;
            padding-right: 18px;
        }
    }
</style>

<!-- ========================================================================== -->
<!-- СЕКЦИЯ: ФИЛИАЛЫ                                                            -->
<!-- ========================================================================== -->
<section id="branches" class="branches-section">
    <div class="branches-layout">

        <!-- Карта -->
        <div class="branches-map" id="branchesMap"></div>

        <!-- Боковая панель -->
        <aside class="branches-sidebar">

            <!-- Вьюха 1: список филиалов -->
            <div class="sidebar-view" id="sidebarList">
                <div class="sidebar-header">
                    <h2 class="sidebar-title" id="sidebarCityTitle">{{ selected_city }}</h2>
                    <div class="sidebar-subtitle" id="sidebarCount"></div>
                </div>
                <ul class="branches-list" id="branchesList"></ul>
            </div>

            <!-- Вьюха 2: детальная информация о филиале -->
            <div class="sidebar-view" id="sidebarDetail" hidden>
                <div class="sidebar-detail-header">
                    <button type="button" class="sidebar-back" id="sidebarBack">
                        ← Назад
                    </button>
                </div>
                <div class="sidebar-detail-body" id="sidebarDetailBody"></div>
            </div>

        </aside>
    </div>
</section>

<!-- ========================================================================== -->
<!-- ДАННЫЕ: филиалы текущего города (JSON из Django)                          -->
<!-- ========================================================================== -->
{{ branches_json|json_script:"branchesData" }}

<!-- ========================================================================== -->
<!-- Yandex Maps API                                                            -->
<!-- ========================================================================== -->
<script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey={{ API_KEY_YANDEX_MAP }}" type="text/javascript"></script>

<!-- ========================================================================== -->
<!-- JS: карта + список + детальная панель                                      -->
<!-- ========================================================================== -->
<script>
(function() {
    'use strict';

    // ==================== ДАННЫЕ ====================
    const branchesDataEl = document.getElementById('branchesData');
    const branches = branchesDataEl ? JSON.parse(branchesDataEl.textContent) : [];

    // ==================== DOM ====================
    const mapEl             = document.getElementById('branchesMap');
    const sidebarList       = document.getElementById('sidebarList');
    const sidebarDetail     = document.getElementById('sidebarDetail');
    const sidebarDetailBody = document.getElementById('sidebarDetailBody');
    const sidebarBack       = document.getElementById('sidebarBack');
    const branchesListEl    = document.getElementById('branchesList');
    const sidebarCityTitle  = document.getElementById('sidebarCityTitle');
    const sidebarCount      = document.getElementById('sidebarCount');

    // ==================== СОСТОЯНИЕ ====================
    let map = null;
    let clusterer = null;
    let placemarksByBranchId = {};   // {branchId: placemark}
    let activeBranchId = null;

    // ==================== ХЕЛПЕРЫ ====================

    // Экранирование HTML (чтобы случайно не вставить теги из данных)
    function esc(str) {
        if (str == null) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // Формируем короткое расписание "ежедневно 09:00–19:00" или "Пн–Пт 09:00–19:00, Сб 10:00–17:00"
    function buildShortSchedule(schedule) {
        if (!schedule || schedule.length === 0) return '';

        // Группируем одинаковые дни
        const groups = [];
        for (const item of schedule) {
            const last = groups[groups.length - 1];
            if (last && last.time === item.time && last.is_closed === item.is_closed) {
                last.days.push(item.day);
            } else {
                groups.push({
                    days: [item.day],
                    time: item.time,
                    is_closed: item.is_closed,
                });
            }
        }

        // Преобразуем в короткие метки
        function shortDay(dayName) {
            const map = {
                'Понедельник': 'Пн',
                'Вторник': 'Вт',
                'Среда': 'Ср',
                'Четверг': 'Чт',
                'Пятница': 'Пт',
                'Суббота': 'Сб',
                'Воскресенье': 'Вс',
            };
            return map[dayName] || dayName;
        }

        function formatGroup(g) {
            const daysCount = g.days.length;
            if (g.is_closed) {
                return 'выходной';
            }
            // Все 7 дней
            if (daysCount === 7) {
                return 'ежедневно ' + g.time;
            }
            // Пн–Пт (5 дней)
            if (daysCount === 5 && g.days[0] === 'Понедельник' && g.days[4] === 'Пятница') {
                return 'Пн–Пт ' + g.time;
            }
            // Сб–Вс (2 дня)
            if (daysCount === 2 && g.days[0] === 'Суббота' && g.days[1] === 'Воскресенье') {
                return 'Сб–Вс ' + g.time;
            }
            // Иначе — перечисляем через запятую
            return g.days.map(shortDay).join(', ') + ' ' + g.time;
        }

        return groups.map(formatGroup).join(', ');
    }

    // ==================== СПИСОК ФИЛИАЛОВ ====================

    function renderList() {
        // Заголовок
        if (sidebarCityTitle) {
            sidebarCityTitle.textContent = branches.length > 0
                ? (branches[0].city || '')
                : '{{ selected_city }}';
        }

        // Счётчик
        if (sidebarCount) {
            const n = branches.length;
            const word = n % 10 === 1 && n % 100 !== 11 ? 'филиал'
                       : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'филиала'
                       : 'филиалов');
            sidebarCount.textContent = n + ' ' + word;
        }

        // Список
        branchesListEl.innerHTML = '';

        if (branches.length === 0) {
            const empty = document.createElement('li');
            empty.className = 'branch-item';
            empty.style.textAlign = 'center';
            empty.style.color = '#888888';
            empty.style.cursor = 'default';
            empty.textContent = 'В этом городе филиалов пока нет';
            branchesListEl.appendChild(empty);
            return;
        }

        for (const branch of branches) {
            const li = document.createElement('li');
            li.className = 'branch-item';
            li.dataset.branchId = branch.id;

            const shortSchedule = buildShortSchedule(branch.schedule);

            li.innerHTML = `
                <div class="branch-item__row">
                    <div class="branch-item__info">
                        <div class="branch-item__address">${esc(branch.address)}</div>
                        <div class="branch-item__schedule">${esc(shortSchedule)}</div>
                    </div>
                    <div class="branch-item__arrow">→</div>
                </div>
            `;

            li.addEventListener('click', function() {
                focusBranch(branch.id);
            });

            branchesListEl.appendChild(li);
        }
    }

    // ==================== ДЕТАЛЬНАЯ ПАНЕЛЬ ====================

    function renderDetail(branch) {
        const shortSchedule = buildShortSchedule(branch.schedule);

        const statusClass = branch.is_open_now
            ? 'detail-status--open'
            : 'detail-status--closed';
        const statusText = branch.is_open_now ? 'Открыт' : 'Закрыт';

        // Ссылка для маршрута (Яндекс.Карты)
        // rtext=~lat,lon — маршрут "от текущего местоположения до точки"
        const routeUrl = `https://yandex.ru/maps/?rtext=~${branch.latitude},${branch.longitude}&rtt=auto`;

        sidebarDetailBody.innerHTML = `
            <h3 class="detail-title">${esc(branch.address)}</h3>
            <div class="detail-city">г. ${esc(branch.city)}</div>

            <div class="detail-schedule">${esc(shortSchedule)}</div>

            <div class="detail-phone">
                <a href="tel:${esc(branch.phone)}">${esc(branch.formatted_phone || branch.phone)}</a>
            </div>

            <span class="detail-status ${statusClass}">${esc(statusText)}</span>

            <a href="${routeUrl}" target="_blank" rel="noopener" class="detail-route-btn">
                Построить маршрут
            </a>
        `;
    }

    // ==================== ПЕРЕКЛЮЧЕНИЕ ВЬЮХ ====================

    function showList() {
        sidebarDetail.hidden = true;
        sidebarList.hidden = false;

        // Снимаем подсветку в списке
        document.querySelectorAll('.branch-item.is-active').forEach(el => {
            el.classList.remove('is-active');
        });

        // Возвращаем карту к общему виду (все точки)
        if (map && clusterer) {
            const bounds = clusterer.getBounds();
            if (bounds) {
                map.setBounds(bounds, {
                    checkZoomRange: true,
                    zoomMargin: 30,
                });
            }
        }

        activeBranchId = null;
    }

    function showDetail(branch) {
        sidebarList.hidden = true;
        sidebarDetail.hidden = false;

        // Подсветка в списке (если потом вернёмся)
        document.querySelectorAll('.branch-item.is-active').forEach(el => {
            el.classList.remove('is-active');
        });
        const activeItem = branchesListEl.querySelector(
            `.branch-item[data-branch-id="${branch.id}"]`
        );
        if (activeItem) {
            activeItem.classList.add('is-active');
            activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        renderDetail(branch);
        activeBranchId = branch.id;
    }

    // ==================== ФОКУС НА ФИЛИАЛЕ ====================

    function focusBranch(branchId) {
        const branch = branches.find(b => b.id === branchId);
        if (!branch) return;

        showDetail(branch);

        // Центрируем карту и приближаем
        if (map) {
            const coords = [branch.latitude, branch.longitude];
            map.setCenter(coords, 17, { duration: 300 });

            // Открываем балун у метки
            const placemark = placemarksByBranchId[branchId];
            if (placemark) {
                placemark.balloon.open();
            }
        }
    }

    // ==================== ИНИЦИАЛИЗАЦИЯ КАРТЫ ====================

    function initMap() {
        if (!mapEl || branches.length === 0) {
            // Нет филиалов — показываем карту с центром на России
            if (mapEl) {
                map = new ymaps.Map(mapEl, {
                    center: [55.751244, 37.618423],  // Москва
                    zoom: 4,
                    controls: ['zoomControl', 'fullscreenControl'],
                });
            }
            return;
        }

        // Центр — первый филиал
        const first = branches[0];

        map = new ymaps.Map(mapEl, {
            center: [first.latitude, first.longitude],
            zoom: 12,
            controls: ['zoomControl', 'fullscreenControl'],
        });

        // Кластеризатор (собирает близкие метки в один кружок)
        clusterer = new ymaps.Clusterer({
            preset: 'islands#invertedBlackClusterIcons',
            groupByCoordinates: false,
            clusterDisableClickZoom: true,
            clusterHideIconOnBalloonOpen: false,
            geoObjectHideIconOnBalloonOpen: false,
        });

        // Добавляем метки
        for (const branch of branches) {
            const placemark = new ymaps.Placemark(
                [branch.latitude, branch.longitude],
                {
                    hintContent: esc(branch.address),
                    balloonContent: `
                        <div style="font-family: Arial, sans-serif; font-size: 13px;">
                            <strong>${esc(branch.address)}</strong><br>
                            ${esc(buildShortSchedule(branch.schedule))}<br>
                            ${esc(branch.formatted_phone || branch.phone)}
                        </div>
                    `,
                },
                {
                    preset: 'islands#blackIcon',
                }
            );

            // Клик по метке → фокус на филиале
            placemark.events.add('click', function() {
                focusBranch(branch.id);
            });

            placemarksByBranchId[branch.id] = placemark;
            clusterer.add(placemark);
        }

        map.geoObjects.add(clusterer);

        // Подгоняем границы, чтобы все метки были видны
        const bounds = clusterer.getBounds();
        if (bounds) {
            map.setBounds(bounds, {
                checkZoomRange: true,
                zoomMargin: 30,
            });
        }

        // Клик по пустому месту карты → возврат к списку
        map.events.add('click', function() {
            if (activeBranchId !== null) {
                showList();
            }
        });
    }

    // ==================== СТАРТ ====================

    function start() {
        renderList();
        initMap();
    }

    // Ждём загрузки Yandex Maps API
    if (window.ymaps && ymaps.ready) {
        ymaps.ready(start);
    } else {
        // API не загрузился — просто показываем список
        renderList();
    }

    // Кнопка "Назад"
    if (sidebarBack) {
        sidebarBack.addEventListener('click', showList);
    }

})();
</script>

{% endblock %}
