{% extends 'base/base.html' %}

{% block title %}Главная - Ломбард Народный{% endblock %}

{% block content %}
{% load static %}
<style>
    /* Общие стили для контейнера */
    .page-container {
        width: 100%;
        padding: 20px;
        box-sizing: border-box;
        max-width: 1400px;
        margin: 0 auto;
    }

    /* Простая надпись с лозунгом */
    .slogan {
        text-align: center;
        margin: 0 auto 40px;
        padding: 0;
        width: 100%;
    }

    .slogan-text {
        font-size: 1.8rem;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 30px;
        font-weight: 600;
        color: #2c3e50;
        margin: 0;
    }

    /* Стили для адаптивной сетки */
    .quadrant-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 25px;
        width: 100%;
        margin: 0 auto;
    }

    .quadrant {
        display: block;
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        box-shadow: 0 6px 12px rgba(217, 181, 115, 0.2);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border: 2px solid #f0e6d3;
        aspect-ratio: 1 / 1;
    }

    .quadrant::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(to bottom, transparent 30%, rgba(217, 4, 22, 0.4) 100%);
        z-index: 1;
        opacity: 0.7;
        transition: opacity 0.3s ease;
    }

    .quadrant:hover {
        transform: translateY(-8px);
        box-shadow: 0 12px 24px rgba(217, 181, 115, 0.4);
        border-color: #D9B573;
    }

    .quadrant:hover::before {
        opacity: 0.9;
    }

    .image-container {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
    }

    .quadrant-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        transition: transform 0.5s ease;
    }

    .quadrant:hover .quadrant-image {
        transform: scale(1.1);
    }

    .quadrant-title {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 20px;
        background: linear-gradient(to top, rgba(217, 181, 115, 0.95), transparent);
        color: white;
        font-size: 1.8rem;
        font-weight: 700;
        z-index: 2;
        text-align: center;
        text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
    }

    .quadrant-icon {
        position: absolute;
        top: 20px;
        left: 20px;
        font-size: 2rem;
        color: white;
        z-index: 2;
        text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
    }

    /* Адаптивность для ПК и планшетов */
    @media (min-width: 1200px) {
        .page-container {
            padding: 40px 20px;
        }

        .slogan {
            margin-bottom: 50px;
        }

        .slogan-text {
            font-size: 2.2rem;
            gap: 40px;
        }

        .quadrant-grid {
            grid-template-columns: repeat(2, 1fr);
            max-width: 1200px;
            gap: 30px;
        }

        .quadrant {
            aspect-ratio: 16 / 9;
        }

        .quadrant-title {
            font-size: 2.2rem;
            padding: 25px;
        }

        .quadrant-icon {
            font-size: 2.5rem;
        }
    }

    @media (min-width: 768px) and (max-width: 1199px) {
        .page-container {
            padding: 30px 20px;
        }

        .slogan {
            margin-bottom: 40px;
        }

        .slogan-text {
            font-size: 1.8rem;
            gap: 25px;
        }

        .quadrant-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .quadrant-title {
            font-size: 1.6rem;
            padding: 15px;
        }
    }

    /* Адаптивность для мобильных */
    @media (max-width: 767px) {
        .page-container {
            padding: 15px;
        }

        .slogan {
            margin-bottom: 30px;
        }

        .slogan-text {
            font-size: 1.4rem;
            flex-direction: row;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .quadrant-grid {
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .quadrant {
            aspect-ratio: 4 / 3;
        }

        .quadrant-title {
            font-size: 1.4rem;
            padding: 12px;
        }

        .quadrant-icon {
            font-size: 1.8rem;
            top: 15px;
            left: 15px;
        }
    }

    /* Для очень маленьких экранов */
    @media (max-width: 480px) {
        .slogan {
            margin-bottom: 25px;
        }

        .slogan-text {
            font-size: 1.2rem;
            gap: 10px;
        }

        .quadrant {
            aspect-ratio: 16 / 9;
        }

        .quadrant-title {
            font-size: 1.2rem;
        }
    }
</style>

<div class="page-container">
    <!-- Простая надпись с лозунгом -->
    <div class="slogan">
        <div class="slogan-text">
            <span>Быстро</span>
            <span>Честно</span>
            <span>Выгодно</span>
        </div>
    </div>

    <!-- Адаптивная сетка -->
    <div class="quadrant-grid">
        <!-- Филиалы -->
        <a href="{% url 'app_branches:branches' %}" class="quadrant">
            <div class="image-container">
                <a href="{% url 'app_branches:branches' %}" class="quadrant">
                <div class="quadrant-icon">🏢</div>
                <div class="quadrant-title">Наши филиалы</div>
            </div>
        </a>

        <!-- Цены -->
        <a href="{% url 'prices' %}" class="quadrant">
            <div class="image-container">
                <img src="{% static 'prices.jpg' %}" alt="Цены" class="quadrant-image">
                <div class="quadrant-icon">💰</div>
                <div class="quadrant-title">Стоимость услуг</div>
            </div>
        </a>

        <!-- Условия -->
        <a href="{% url 'conditions' %}" class="quadrant">
            <div class="image-container">
                <img src="{% static 'conditions.jpg' %}" alt="Условия" class="quadrant-image">
                <div class="quadrant-icon">📋</div>
                <div class="quadrant-title">Условия работы</div>
            </div>
        </a>

        <!-- Вопросы и ответы -->
        <a href="{% url 'questions_answers' %}" class="quadrant">
            <div class="image-container">
                <img src="{% static 'questions_answers.jpg' %}" alt="Вопросы и ответы" class="quadrant-image">
                <div class="quadrant-icon">❓</div>
                <div class="quadrant-title">Вопросы и ответы</div>
            </div>
        </a>
    </div>
</div>
{% endblock %}
